name: build

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*-ports.*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish checked board builds as vX.Y.Z-ports.N; leave empty for checks only'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: seeder-${{ github.workflow }}-${{ github.ref }}-${{ inputs.release_tag || '' }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # La interfaz se diseñó sobre 240x135 y se escala con SX()/SY(), pero las
      # fuentes no escalan. Esto verifica que nada se sale en ninguna placa.
      - name: Auditar la interfaz en las tres placas
        run: python scripts/audit_ui.py
      - name: Test release packaging and board contracts
        run: python -m unittest discover -s tests/release -v
      - name: Compare production seed calculations against an independent reference
        run: |
          python -m pip install -r tests/crypto/requirements.txt
          python tests/crypto/build.py
          python tests/crypto/verify.py
      - name: Check matching StickS3 and Waveshare controls
        run: python tests/workflow/build.py
      - name: Verify CompactSeedQR binary round trips
        run: |
          python -m pip install -r tests/qr/requirements.txt
          python tests/qr/verify.py

  firmware:
    needs: audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # En ESP32 el bootloader va a 0x1000; en ESP32-S3 va a 0x0.
          # Copiar el offset de una a la otra produce un binario que no arranca.
          - env: tdisplay
            chip: esp32
            boot_offset: "0x1000"
            flash_size: "4MB"
          - env: tdisplay-s3
            chip: esp32s3
            boot_offset: "0x0"
            flash_size: "16MB"
          - env: sticks3
            chip: esp32s3
            boot_offset: "0x0"
            flash_size: "8MB"
          - env: waveshare175c
            chip: esp32s3
            flash_size: "32MB"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}

      - name: Install toolchain
        run: pip install platformio==6.2.0 esptool==4.9.0

      - name: Build
        run: pio run -e ${{ matrix.env }}

      # esptool-js quiere un solo fichero al offset 0. Fundir aquí las cuatro
      # imágenes deja el tutorial de flasheo en un arrastrar y soltar.
      - name: Merge original T-Display targets
        if: matrix.env == 'tdisplay' || matrix.env == 'tdisplay-s3'
        run: |
          set -eu
          OUT=.pio/build/${{ matrix.env }}
          BOOT_APP0="$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin"
          NAME=seeder-${{ matrix.env }}
          mkdir -p dist
          python -m esptool --chip ${{ matrix.chip }} merge_bin \
            -o dist/$NAME-merged.bin \
            --flash_mode dio --flash_freq 80m --flash_size ${{ matrix.flash_size }} \
            ${{ matrix.boot_offset }} "$OUT/bootloader.bin" \
            0x8000  "$OUT/partitions.bin" \
            0xe000  "$BOOT_APP0" \
            0x10000 "$OUT/firmware.bin"
          cp "$OUT/firmware.bin"   dist/$NAME-firmware.bin
          cp "$OUT/bootloader.bin" dist/$NAME-bootloader.bin
          cp "$OUT/partitions.bin" dist/$NAME-partitions.bin
          sha256sum dist/* | tee dist/SHA256SUMS-${{ matrix.env }}

      # The PlatformIO post-action validates the image hashes, fixed layout,
      # exact input bytes and erased gaps. Do not overwrite its guarded merge.
      - name: Package guarded StickS3 image
        if: matrix.env == 'sticks3'
        run: |
          set -eu
          OUT=.pio/build/sticks3
          test -f dist/seeder-sticks3-merged.bin
          cp "$OUT/firmware.bin" dist/seeder-sticks3-firmware.bin
          cp "$OUT/bootloader.bin" dist/seeder-sticks3-bootloader.bin
          cp "$OUT/partitions.bin" dist/seeder-sticks3-partitions.bin
          cp "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin" dist/seeder-sticks3-boot_app0.bin
          sha256sum dist/* | tee dist/SHA256SUMS-sticks3

      - name: Verify exact BitMaker pixels, round placement and button workflow
        if: matrix.env == 'waveshare175c'
        run: |
          python -m pip install -r tests/round/requirements.txt
          python tests/round/build.py
          python tests/round/verify.py

      # The 1.75C retains its factory bootloader/partitions and installs ONLY
      # the application at 0x200000 through the guarded, identity-checked tool.
      - name: Package Waveshare application only
        if: matrix.env == 'waveshare175c'
        run: |
          mkdir -p dist
          cp .pio/build/waveshare175c/firmware.bin dist/seeder-waveshare175c-firmware.bin
          cp scripts/flash_waveshare175c.py README-WAVESHARE175C.md dist/
          sha256sum dist/* | tee dist/SHA256SUMS-${{ matrix.env }}

      # Un generador de semillas vale lo que valga el rastro de su binario.
      - name: Show what went into the image
        run: cat dist/SHA256SUMS-${{ matrix.env }}

      - uses: actions/upload-artifact@v4
        with:
          name: seeder-${{ matrix.env }}
          path: dist/

  release:
    name: Publish complete fork release
    needs: [audit, firmware]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: seeder-*
          path: release-input
      - name: Validate and package both supported fork boards
        run: |
          python scripts/package_release.py --artifacts release-input --output release \
            --tag "$RELEASE_TAG" --commit "$GITHUB_SHA"
          cd release
          sha256sum -c SHA256SUMS
      - name: Draft, verify complete assets and publish
        run: python scripts/publish_release.py --directory release --tag "$RELEASE_TAG" --commit "$GITHUB_SHA"
